[project]
name = "mtg-deck-doctor"
version = "0.1.0"
description = "Analyze Magic: The Gathering decks with deterministic metrics and grounded LLM recommendations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.32.0,<1.0",
    "pydantic>=2.9.0,<3.0",
    "pydantic-settings>=2.6.0,<3.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "asyncpg>=0.30.0,<1.0",
    "alembic>=1.14.0,<2.0",
    "aio-pika>=9.4.0,<10.0",
    "httpx>=0.28.0,<1.0",
    "langchain>=0.3.0,<1.0",
    "langchain-openai>=0.2.0,<1.0",
    "langgraph>=0.2.0,<1.0",
    "python-dotenv>=1.0.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0",
    "pytest-asyncio>=0.24.0,<1.0",
    "ruff>=0.8.0,<1.0",
    "aiosqlite>=0.20.0,<1.0",
]

[project.scripts]
mtg-api = "app.main:run"
mtg-worker = "app.workers.analysis_worker:main"
mtg-outbox = "app.workers.outbox_publisher:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: tests that require Docker services",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"app/api/**" = ["B008"]
